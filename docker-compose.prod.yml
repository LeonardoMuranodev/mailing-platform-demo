# ══════════════════════════════════════════════════════════════
# Docker Compose — PRODUCCIÓN (GenMailer)
# ══════════════════════════════════════════════════════════════
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con desarrollo:
#   - Frontend → Nginx (build estático) con reverse proxy a /api
#   - Sin Mailpit — se conecta a SMTPs reales de Gmail
#   - Redis no expone puerto al host (solo red interna)
#   - NODE_ENV=production
# ══════════════════════════════════════════════════════════════

services:
  # ─── 1. BACKEND API (Node.js / Express / TypeScript) ───────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mails-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mails-network

  # ─── 2. FRONTEND (Nginx — Build Estático + Reverse Proxy) ──
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.frontend
      target: production
    container_name: mails-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mails-network

  # ─── 3. REDIS (Cache) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mails-redis
    restart: unless-stopped
    # No se expone al host en producción — solo accesible dentro de la red Docker
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mails-network

  # ─── 4. DB BACKUP (PostgreSQL Dump → Google Drive) ─────────
  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: mails-db-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./BACKUPS:/backups

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────
networks:
  mails-network:
    driver: bridge
